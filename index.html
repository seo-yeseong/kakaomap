<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 카카오맵 장소 검색</title>
    <style>
        /* 기본 스타일 초기화 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Malgun Gothic', dotum, sans-serif; }

        /* 화면을 왼쪽(검색)과 오른쪽(지도)으로 분할 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 바 */
        #sidebar {
            width: 350px;
            height: 100%;
            background: #f7f7f7;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .search-box {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
        }

        #keyword {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #search-btn {
            padding: 8px 15px;
            background: #fae100; /* 카카오 노란색 */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 검색 결과 리스트 스타일 */
        #placesList { list-style: none; }
        .item { border-bottom: 1px solid #ddd; padding: 15px 0; line-height: 1.5; }
        .item h5 { color: #333; font-size: 16px; }
        .item .address { font-size: 13px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div id="sidebar">
        <h2>장소 검색</h2>
        <div class="search-box">
            <input type="text" id="keyword" placeholder="검색어를 입력하세요">
            <button id="search-btn">검색</button>
        </div>
        <hr>
        <ul id="placesList"></ul>
    </div>

    <div id="map"></div>
</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=76fdac83397fb48814297d9412f5f886&libraries=services"></script>

<script>
    // 1. 전역 변수 설정
    let map;
    let placeService;
    let markers = []; // 마커를 담을 배열

    // 2. 초기화 함수 (페이지 로드 시 실행)
    function initMap() {
        const mapContainer = document.getElementById('map'); 
        const mapOption = { 
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 위치 권한 허용 전 기본 위치(서울시청)
            level: 5 // 지도 확대 레벨
        }; 

        // 지도 생성
        map = new kakao.maps.Map(mapContainer, mapOption); 
        
        // 장소 검색 객체 생성
        placeService = new kakao.maps.services.Places(); 

        // 현재 위치 가져오기
        getCurrentLocation();
    }

    // 3. 사용자의 현재 위치를 가져와 지도를 이동시키는 함수
    function getCurrentLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude; // 위도
                const lon = position.coords.longitude; // 경도
                
                const locPosition = new kakao.maps.LatLng(lat, lon);
                
                // 지도 중심을 현재 위치로 이동
                map.setCenter(locPosition);
                
                // 현재 위치에 손가락 모양 마커 표시
                displayMarker(locPosition, "내 위치");
            });
        } else {
            alert("이 브라우저에서는 위치 정보(Geolocation)를 사용할 수 없습니다.");
        }
    }

    // 4. 마커를 생성하고 지도 위에 표시하는 함수 (손가락 모양 커스텀)
    function displayMarker(position, title) {
        // 손가락 모양 이미지 (외부 이미지 URL 사용)
        const imageSrc = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png'; // 기본 마커 대신 사용자가 원하는 커스텀 이미지 가능
        // 만약 완전한 손가락 모양을 원한다면 아래 주석처럼 커서 모양 이미지 URL을 넣으면 돼!
        // const imageSrc = 'https://cdn-icons-png.flaticon.com/512/1077/1077180.png'; 
        
        const imageSize = new kakao.maps.Size(35, 35); 
        const markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize);

        const marker = new kakao.maps.Marker({
            map: map,
            position: position,
            title: title,
            image: markerImage // 마커에 커스텀 이미지 설정
        });

        markers.push(marker); // 마커를 배열에 추가
    }

    // 5. 장소 검색 함수
    function searchPlaces() {
        const keyword = document.getElementById('keyword').value;

        if (!keyword.replace(/^\s+|\s+$/g, '')) {
            alert('키워드를 입력해주세요!');
            return false;
        }

        // 카카오 SDK를 이용한 장소 검색 실행
        placeService.keywordSearch(keyword, placesSearchCB);
    }

    // 6. 검색 결과 콜백 함수
    function placesSearchCB(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data);
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('검색 결과가 존재하지 않습니다.');
        } else if (status === kakao.maps.services.Status.ERROR) {
            alert('검색 결과 중 오류가 발생했습니다.');
        }
    }

    // 7. 검색 결과 목록과 마커를 표출하는 함수
    function displayPlaces(places) {
        const listEl = document.getElementById('placesList');
        const bounds = new kakao.maps.LatLngBounds();
        
        // 기존 검색 결과 및 마커 제거
        listEl.innerHTML = '';
        removeMarkers();

        for (let i = 0; i < places.length; i++) {
            const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
            const itemEl = document.createElement('li');
            
            itemEl.className = 'item';
            itemEl.innerHTML = `<h5>${places[i].place_name}</h5>
                                <span class="address">${places[i].address_name}</span>`;

            // 마커 표시
            displayMarker(placePosition, places[i].place_name);
            bounds.extend(placePosition);
            listEl.appendChild(itemEl);
        }

        // 검색된 장소들을 포함하도록 지도 범위 수정
        map.setBounds(bounds);
    }

    // 마커 제거 함수
    function removeMarkers() {
        for (let i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }   
        markers = [];
    }

    // 버튼 클릭 및 엔터 키 이벤트 리스너
    document.getElementById('search-btn').addEventListener('click', searchPlaces);
    document.getElementById('keyword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') searchPlaces();
    });

    // 8. API가 로드된 후 초기화 실행
    kakao.maps.load(initMap);

</script>

</body>
</html>
