<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }

        /* 화면을 왼쪽과 오른쪽으로 2분할하는 컨테이너 */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 왼쪽: 검색창 + 결과 리스트 영역 */
        .sidebar {
            width: 350px; /* 사이드바 너비 고정 */
            height: 100%;
            background-color: #f8f9fa;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* 검색창 영역 */
        .search-box {
            padding: 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
        }

        .search-box h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #333;
        }

        .search-form {
            display: flex;
            gap: 5px;
        }

        .search-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }

        .search-button {
            padding: 10px 15px;
            background-color: #fee500; /* 카카오 시그니처 옐로우 */
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-button:hover {
            background-color: #fada0a;
        }

        /* 검색 결과 리스트 영역 (스크롤 가능) */
        .places-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            list-style: none;
        }

        .place-item {
            padding: 15px;
            background-color: #ffffff;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .place-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .place-name {
            font-weight: bold;
            color: #212529;
            margin-bottom: 5px;
        }

        .place-address {
            font-size: 13px;
            color: #6c757d;
        }

        /* 오른쪽: 지도 영역 */
        .map-container {
            flex: 1; /* 남은 화면 전체 차지 */
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
