<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    <style>
        /* 화면 구성 스타일 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Pretendard', sans-serif; }

        .container { display: flex; width: 100%; height: 100vh; }

        /* 왼쪽 사이드바 */
        #sidebar {
            width: 350px; height: 100%; background: #ffffff;
            padding: 20px; overflow-y: auto; z-index: 10;
            border-right: 1px solid #eee;
        }

        .search-box { display: flex; gap: 5px; margin-bottom: 20px; }
        #keyword { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        #search-btn { padding: 10px 15px; background: #fae100; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* 오른쪽 지도 */
        #map { flex: 1; height: 100%; background-color: #f0f0f0; } /* 로드 전 배경색 */

        /* 검색 결과 */
        .item { padding: 15px 0; border-bottom: 1px solid #f0f0f0; list-style: none; }
        .item h5 { margin-bottom: 5px; color: #333; }
        .item p { font-size: 13px; color: #777; }
    </style>
</head>
<body>

<div class="container">
    <div id="sidebar">
        <h3>📍 장소 검색</h3>
        <div class="search-box">
            <input type="text" id="keyword" placeholder="장소를 입력하세요" onkeypress="if(event.keyCode==13) searchPlaces()">
            <button id="search-btn" onclick="searchPlaces()">검색</button>
        </div>
        <ul id="placesList"></ul>
    </div>
    <div id="map"></div>
</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=76fdac83397fb48814297d9412f5f886&libraries=services&autoload=false"></script>

<script>
    let map;
    let placeService;
    let markers = [];

    // 1. API 로드 확인 후 실행
    kakao.maps.load(function() {
        const mapContainer = document.getElementById('map');
        const mapOption = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 위치 (서울시청)
            level: 5
        };

        // 지도 생성
        map = new kakao.maps.Map(mapContainer, mapOption);
        // 장소 검색 서비스 객체 생성
        placeService = new kakao.maps.services.Places();

        // 2. 현재 위치 가져오기 시도
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const currentPos = new kakao.maps.LatLng(lat, lon);
                
                map.setCenter(currentPos); // 지도를 내 위치로 이동
                displayMarker(currentPos, "현재 위치"); // 손가락 마커 표시
            }, function(error) {
                console.error("위치 정보를 가져오는데 실패했습니다.", error);
            });
        }
    });

    // 3. 마커 생성 함수 (손가락 이미지 커스텀)
    function displayMarker(position, title) {
        // 손가락 모양 마커 이미지 주소 (카카오 기본 마커 대신 사용)
        const imageSrc = "https://t1.daumcdn.net/localimg/localimages/07/2011/img/marker_p.png"; 
        const imageSize = new kakao.maps.Size(40, 42); 
        const markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize);

        const marker = new kakao.maps.Marker({
            map: map,
            position: position,
            title: title,
            image: markerImage
        });

        markers.push(marker);
    }

    // 4. 장소 검색 실행
    function searchPlaces() {
        const keyword = document.getElementById('keyword').value;
        if (!keyword.trim()) {
            alert("검색어를 입력해 주세요!");
            return;
        }
        placeService.keywordSearch(keyword, searchCallback);
    }

    // 5. 검색 결과 콜백
    function searchCallback(data, status) {
        if (status === kakao.maps.services.Status.OK) {
            const listEl = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds();
            
            // 기존 마커 및 리스트 초기화
            listEl.innerHTML = "";
            removeMarkers();

            for (let i = 0; i < data.length; i++) {
                const placePos = new kakao.maps.LatLng(data[i].y, data[i].x);
                
                // 마커 추가
                displayMarker(placePos, data[i].place_name);
                
                // 사이드바 리스트 추가
                const itemEl = document.createElement('li');
                itemEl.className = 'item';
                itemEl.innerHTML = `<h5>${data[i].place_name}</h5><p>${data[i].address_name}</p>`;
                listEl.appendChild(itemEl);
