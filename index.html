<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Malgun Gothic', dotum, sans-serif; }
        .container { display: flex; width: 100%; height: 100%; }
        .sidebar { width: 350px; height: 100%; background-color: #f8f9fa; box-shadow: 2px 0 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; z-index: 10; }
        .search-box { padding: 20px; background-color: #ffffff; border-bottom: 1px solid #e9ecef; }
        .search-box h2 { font-size: 1.2rem; margin-bottom: 10px; color: #333; }
        .search-form { display: flex; gap: 5px; }
        .search-input { flex: 1; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; }
        .search-button { padding: 10px 15px; background-color: #fee500; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .places-list { flex: 1; overflow-y: auto; padding: 10px; list-style: none; }
        .place-item { padding: 15px; background-color: #ffffff; margin-bottom: 10px; border-radius: 6px; border: 1px solid #e9ecef; cursor: pointer; }
        .place-name { font-weight: bold; color: #212529; margin-bottom: 5px; }
        .place-address { font-size: 13px; color: #6c757d; }
        .map-container { flex: 1; height: 100%; background-color: #eee; } /* 지도가 안 나올 때 회색 바탕으로 표시 */
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <h2>어디로 갈까요?</h2>
                <form class="search-form" onsubmit="searchPlaces(); return false;">
                    <input type="text" id="keyword" class="search-input" placeholder="장소 검색" value="강남역">
                    <button type="submit" class="search-button">검색</button>
                </form>
            </div>
            <ul id="placesList" class="places-list"></ul>
        </div>
        <div id="map" class="map-container"></div>
    </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7d9a277cfc4d368da119fb50f73b42c5&libraries=services&autoload=false"></script>
    
    <script>
        let map; 
        let placesService;
        let markers = [];
        let infoWindow;

        kakao.maps.load(function() {
            initMap();
        });

        function initMap() {
            const mapContainer = document.getElementById('map');
            const defaultPosition = new kakao.maps.LatLng(37.5559, 126.9723); // 서울역 위치
            
            const mapOptions = {
                center: defaultPosition,
                level: 5
            };

            // 지도 생성
            map = new kakao.maps.Map(mapContainer, mapOptions);
            placesService = new kakao.maps.services.Places();
            infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 💡 수정포인트 2: 현재 위치를 못 가져오더라도 지도는 서울역 기준으로 정상 작동하게 분리
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const currentPosition = new kakao.maps.LatLng(lat, lon);
                    
                    map.setCenter(currentPosition);
                    new kakao.maps.Marker({ map: map, position: currentPosition });
                }, function(error) {
                    // 위치 권한 거부 시 콘솔에만 찍고 지도는 기본 위치(서울역)로 유지
                    console.log("위치 권한을 허용하지 않아 기본 위치로 표시합니다.");
                });
            }
        }

        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;
            if (!keyword.trim()) { alert('키워드를 입력해주세요!'); return; }
            placesService.keywordSearch(keyword, placesSearchCB);
        }

        function placesSearchCB(data, status) {
            if (status === kakao.maps.services.Status.OK) { displayPlaces(data); } 
            else if (status === kakao.maps.services.Status.ZERO_RESULT) { alert('검색 결과가 없습니다.'); }
        }

        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds();
            removeMarkers();
            listEl.innerHTML = '';

            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                const marker = new kakao.maps.Marker({ position: placePosition, map: map });
                markers.push(marker);

                const itemEl = document.createElement('li');
                itemEl.className = 'place-item';
                itemEl.innerHTML = `
                    <div class="place-name">${places[i].place_name}</div>
                    <div class="place-address">${places[i].road_address_name || places[i].address_name}</div>
                `;

                itemEl.onclick = function() {
                    map.setCenter(placePosition);
                    infoWindow.setContent('<div style="padding:5px;font-size:12px;">' + places[i].place_name + '</div>');
                    infoWindow.open(map, marker);
                };

                listEl.appendChild(itemEl);
                bounds.extend(placePosition);
            }
            map.setBounds(bounds);
        }

        function removeMarkers() {
            for (let i = 0; i < markers.length; i++) { markers[i].setMap(null); }
            markers = [];
        }
    </script>
</body>
</html>
