<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배부른 너의 모습이 좋아</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Malgun Gothic', dotum, sans-serif; background-color: #f5f6fa; }
        .container { display: flex; width: 100%; height: 100%; }
        
        .sidebar { width: 380px; height: 100%; background-color: #ffffff; box-shadow: 3px 0 10px rgba(0,0,0,0.08); display: flex; flex-direction: column; z-index: 10; }
        
        .app-header { padding: 20px 20px 10px 20px; background-color: #ffffff; border-bottom: 1px dashed #e9ecef; }
        .app-header h1 { font-size: 1.4rem; color: #2d3436; font-weight: 800; letter-spacing: -0.5px; }
        .app-header p { font-size: 11px; color: #b2bec3; margin-top: 2px; }

        .tab-menu { display: flex; background-color: #f1f2f6; padding: 5px 10px; }
        .tab-button { flex: 1; padding: 12px 0; border: none; background: none; font-size: 13px; font-weight: bold; color: #7f8c8d; cursor: pointer; transition: all 0.2s; text-align: center; border-radius: 6px; }
        .tab-button.active.burger-theme { background-color: #ff9f43; color: #ffffff; }
        .tab-button.active.icecream-theme { background-color: #00d2d3; color: #ffffff; }

        .search-box { padding: 15px 20px; background-color: #ffffff; border-bottom: 1px solid #e9ecef; }
        .search-box h2 { font-size: 1rem; margin-bottom: 8px; color: #ff9f43; transition: color 0.2s; }
        .search-box h2.icecream-theme { color: #00d2d3; }
        
        .search-form { display: flex; gap: 5px; }
        .search-input { flex: 1; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; }
        .search-input:focus { border-color: #ff9f43; outline: none; }
        
        .search-button { padding: 10px 15px; background-color: #ff9f43; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .search-button.icecream-theme { background-color: #00d2d3; }

        .places-list { flex: 1; overflow-y: auto; padding: 15px; list-style: none; background-color: #f8f9fa; }
        .place-item { padding: 0; background-color: #ffffff; margin-bottom: 15px; border-radius: 10px; border: 1px solid #e9ecef; cursor: pointer; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: transform 0.2s, box-shadow 0.2s; }
        .place-item:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.05); }
        
        .place-image-box { width: 100%; height: 120px; background-size: cover; background-position: center; background-color: #dfe6e9; }
        .place-info-padding { padding: 15px; }
        
        .place-name { font-size: 15px; font-weight: bold; color: #212529; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .place-address { font-size: 12px; color: #6c757d; margin-bottom: 8px; }
        
        .place-category { font-size: 11px; color: #ff9f43; background: #fff0e0; display: inline-block; padding: 2px 6px; border-radius: 10px; }
        .place-category.icecream-theme { color: #00d2d3; background: #e0f7f7; }
        
        .detail-link { font-size: 11px; color: #0984e3; text-decoration: none; font-weight: bold; }

        .map-container { flex: 1; height: 100%; background-color: #eee; } 

        .emoji-marker { font-size: 32px; animation: bounce 0.3s ease-out; cursor: pointer; filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.3)); }
        @keyframes bounce { 0% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="app-header">
                <h1>배부른 너의 모습이 좋아 💕</h1>
                <p>🍔 동네 맛집부터 🍦 디저트 핫플까지 지도 가이드</p>
            </div>

            <div class="tab-menu">
                <button id="tabBurger" class="tab-button active burger-theme" onclick="switchTab('burger')">🍔 햄버거</button>
                <button id="tabIcecream" class="tab-button" onclick="switchTab('icecream')">🍦 아이스크림</button>
            </div>

            <div class="search-box">
                <h2 id="searchTitle">우리동네 맛있는 햄버거집</h2>
                <form class="search-form" onsubmit="searchPlaces(); return false;">
                    <input type="text" id="keyword" class="search-input" placeholder="지역 이름 입력 (예: 강남역, 홍대)">
                    <button type="submit" id="searchBtn" class="search-button">검색</button>
                </form>
            </div>
            <ul id="placesList" class="places-list"></ul>
        </div>
        <div id="map" class="map-container"></div>
    </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7d9a277cfc4d368da119fb50f73b42c5&libraries=services"></script>
    
    <script>
        let map; 
        let placesService;
        let markers = []; 
        let infoWindow;
        let currentTab = 'burger'; 

        initMap();

        function initMap() {
            const mapContainer = document.getElementById('map');
            
            // 💡 수정포인트 1: 초기 진입 시 대한민국 전체 지도가 뜨지 않도록 강남역 좌표(37.4979, 127.0276)를 기본 중심점으로 미리 단단히 고정합니다.
            const defaultPosition = new kakao.maps.LatLng(37.4979, 127.0276); 
            
            const mapOptions = {
                center: defaultPosition,
                level: 4 // 처음부터 줌 레벨을 대폭 확대하여 주변 건물 단주위로 가깝게 보여줍니다.
            };

            map = new kakao.maps.Map(mapContainer, mapOptions);
            placesService = new kakao.maps.services.Places();
            infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 사용자 실시간 위치 수신 및 동기화
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const currentPosition = new kakao.maps.LatLng(lat, lon);
                    
                    // 내 진짜 위치가 잡히면 부드럽게 지도를 이동하고 레벨을 밀착 고정합니다.
                    map.setCenter(currentPosition);
                    map.setLevel(4);
                    
                    new kakao.maps.Marker({ map: map, position: currentPosition });
                    
                    // 곧바로 잡힌 내 위치 근처의 맛집 서치 실행
                    searchPlaces();
                }, function(error) {
                    console.log("위치 권한 미허용 - 기본 고정 위치(강남역 주변)로 탐색합니다.");
                    searchPlaces(); 
                });
            } else {
                searchPlaces();
            }
        }

        function switchTab(tabName) {
            if (currentTab === tabName) return; 
            currentTab = tabName;

            const tabBurger = document.getElementById('tabBurger');
            const tabIcecream = document.getElementById('tabIcecream');
            const searchTitle = document.getElementById('searchTitle');
            const searchBtn = document.getElementById('searchBtn');

            document.getElementById('placesList').innerHTML = '';
            removeMarkers();

            if (currentTab === 'burger') {
                tabBurger.className = 'tab-button active burger-theme';
                tabIcecream.className = 'tab-button';
                searchTitle.className = '';
                searchTitle.innerText = '우리동네 맛있는 햄버거집';
                searchBtn.className = 'search-button';
            } else {
                tabBurger.className = 'tab-button';
                tabIcecream.className = 'tab-button active icecream-theme';
                searchTitle.className = 'icecream-theme';
                searchTitle.innerText = '달콤 시원한 아이스크림 매장';
                searchBtn.className = 'search-button icecream-theme';
            }

            searchPlaces();
        }

        function searchPlaces() {
            const userInput = document.getElementById('keyword').value.trim();
            
            // 💡 수정포인트 2: 단순 텍스트 매칭 대신, 카카오 카테고리 필터링 키워드를 명확하게 선언합니다.
            const categoryKeyword = (currentTab === 'burger') ? '햄버거' : '아이스크림';

            document.getElementById('placesList').innerHTML = '';
            removeMarkers();

            // 1. 검색창에 아무것도 입력하지 않은 상태일 때 (내 현재 위치 주변 탐색)
            if (!userInput) {
                const currentCenter = map.getCenter();
                placesService.keywordSearch(categoryKeyword, placesSearchCB, {
                    location: currentCenter,
                    radius: 2500, // 반경 2.5km 이내로 제한하여 대한민국 전역 확산을 철저히 방지합니다.
                    sort: kakao.maps.services.SortBy.DISTANCE
                });
            } 
            // 2. 사용자가 검색창에 특정 '지역명'(예: 홍대, 신촌 등)을 직접 입력하고 검색했을 때
            else {
                // 입력한 해당 지역 중심점을 먼저 안전하게 도출하기 위해 1차 검색을 수행합니다.
                placesService.keywordSearch(userInput, function(data, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        const searchRegionPos = new kakao.maps.LatLng(data[0].y, data[0].x);
                        
                        // 지도를 튕김 없이 타겟 지역으로 직행시킨 뒤 레벨을 확대 고정합니다.
                        map.setCenter(searchRegionPos);
                        map.setLevel(4); 

                        // 💡 수정포인트 3: 찾아낸 지역 중심 좌표를 기반으로 "진짜 햄버거집/아이스크림집"만 엄격하게 한정 필터 서치합니다!
                        placesService.keywordSearch(categoryKeyword, placesSearchCB, {
                            location: searchRegionPos,
                            radius: 2500,
                            sort: kakao.maps.services.SortBy.DISTANCE
                        });
                    } else {
                        alert('올바른 지역 이름이나 동네 명칭을 입력해 주세요!');
                    }
                });
            }
        }

        function placesSearchCB(data, status) {
            if (status === kakao.maps.services.Status.OK) { 
                displayPlaces(data); 
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) { 
                alert('해당 반경 내에는 매장이 존재하지 않습니다.'); 
            }
        }

        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            const markerEmoji = (currentTab === 'burger') ? '🍔' : '🍦';

            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                const markerContent = document.createElement('div');
                markerContent.className = 'emoji-marker';
                markerContent.innerHTML = markerEmoji;

                const customMarker = new kakao.maps.CustomOverlay({
                    position: placePosition,
                    content: markerContent,
                    yAnchor: 0.9 
                });
                
                customMarker.setMap(map);
                markers.push(customMarker);

                const itemEl = document.createElement('li');
                itemEl.className = 'place-item';
                
                const categoryArray = places[i].category_name.split(' > ');
                const categoryMenu = categoryArray[categoryArray.length - 1] || "매장";
                const themeClass = (currentTab === 'icecream') ? 'icecream-theme' : '';

                const detailUrl = places[i].place_url;
                const foodImageUrl = (currentTab === 'burger') 
                    ? `https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&auto=format&fit=crop&q=60`
                    : `https://images.unsplash.com/photo-1501443762994-82bd5dace89a?w=400&auto=format&fit=crop&q=60`;

                itemEl.innerHTML = `
                    <div class="place-image-box" style="background-image: url('${foodImageUrl}');" onclick="window.open('${detailUrl}', '_blank')"></div>
                    <div class="place-info-padding">
                        <div class="place-name">
                            <span>${places[i].place_name}</span>
                            <a href="${detailUrl}" target="_blank" class="detail-link">실제 사진/리뷰 ↗</a>
                        </div>
                        <div class="place-address">${places[i].road_address_name || places[i].address_name}</div>
                        <div class="place-category ${themeClass}">${categoryMenu}</div>
                    </div>
                `;

                function showPopup() {
                    map.setCenter(placePosition);
                    const highlightColor = (currentTab === 'burger') ? '#ff9f43' : '#00d2d3';
                    
                    const popupContent = `
                        <div style="padding:8px; font-size:12px; min-width:220px; line-height: 1.6;">
                            <div style="width:100%; height:70px; background-image:url('${foodImageUrl}'); background-size:cover; background-position:center; border-radius:4px; margin-bottom:8px;"></div>
                            <strong style="color:${highlightColor}; font-size:13px;">${places[i].place_name}</strong><br>
                            <span style="color:#6c757d; font-size:11px;">${places[i].road_address_name || places[i].address_name}</span><br>
                            <a href="${detailUrl}" target="_blank" style="color:#0984e3; text-decoration:none; font-size:11px; font-weight:bold; display:inline-block; margin-top:4px;">상세보기 및 실제 리뷰 보기 →</a>
                        </div>
                    `;
                    
                    infoWindow.setContent(popupContent);
                    infoWindow.open(map, customMarker);
                }

                itemEl.querySelector('.place-info-padding').onclick = showPopup;
                markerContent.onclick = showPopup;

                listEl.appendChild(itemEl);
            }
            
            // 💡 대한민국 축소 튕김 현상의 주범이었던 기존 전체 범위 재설정 코드는 완전히 도려내었습니다.
            // 대신 결과물 중 가낭 최상단(가장 가까운) 매장의 좌표로 줌 레벨 무너짐 없이 정밀 타겟 무빙합니다.
            if(places.length > 0) {
                const firstPlacePos = new kakao.maps.LatLng(places[0].y, places[0].x);
                map.setCenter(firstPlacePos);
            }
        }

        function removeMarkers() {
            for (let i = 0; i < markers.length; i++) { markers[i].setMap(null); }
            markers = [];
            infoWindow.close(); 
        }
    </script>
</body>
</html>
