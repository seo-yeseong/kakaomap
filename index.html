<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>카카오맵 테스트</title>
    <style>
        body { margin: 0; padding: 0; display: flex; height: 100vh; }
        #sidebar { width: 300px; background: #f8f9fa; border-right: 1px solid #ddd; padding: 20px; z-index: 2; }
        /* 지도가 안 보일 때를 대비해 배경색을 회색으로 설정 */
        #map { flex: 1; background-color: #e0e0e0; position: relative; }
        #loading-msg { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-weight: bold; color: #666;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>🔍 장소 검색</h3>
    <input type="text" id="keyword" placeholder="장소 입력" style="width:100%; padding:8px;">
    <button onclick="search()" style="width:100%; margin-top:10px; padding:10px; background:#fae100; border:none; cursor:pointer;">검색하기</button>
</div>

<div id="map">
    <div id="loading-msg">지도를 불러오는 중입니다... (안 나온다면 F12 콘솔 확인!)</div>
</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=76fdac83397fb48814297d9412f5f886&libraries=services"></script>

<script>
    var map;
    var ps;

    // 지도가 로드되었는지 확인하는 가장 안전한 방법
    window.onload = function() {
        if (typeof kakao === 'undefined' || typeof kakao.maps === 'undefined') {
            document.getElementById('loading-msg').innerHTML = "<span style='color:red;'>카카오 라이브러리 로드 실패! 인터넷 연결이나 API 키를 확인하세요.</span>";
            return;
        }

        var container = document.getElementById('map');
        var options = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567),
            level: 5
        };

        map = new kakao.maps.Map(container, options);
        ps = new kakao.maps.services.Places();
        
        // 지도가 뜨면 로딩 메시지 삭제
        document.getElementById('loading-msg').style.display = 'none';

        // 현재 위치 요청
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(pos) {
                var moveLatLon = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
                map.setCenter(moveLatLon);
                
                // 손가락 모양 마커 (카카오 기본 제공 이미지 중 하나)
                var marker = new kakao.maps.Marker({
                    map: map,
                    position: moveLatLon,
                    image: new kakao.maps.MarkerImage(
                        'https://t1.daumcdn.net/localimg/localimages/07/2011/img/marker_p.png',
                        new kakao.maps.Size(40, 42)
                    )
                });
            });
        }
    };

    function search() {
        var word = document.getElementById('keyword').value;
        if (!word) return alert("검색어를 입력하세요!");
        ps.keywordSearch(word, function(data, status) {
            if (status === kakao.maps.services.Status.OK) {
                var bounds = new kakao.maps.LatLngBounds();
                for (var i=0; i<data.length; i++) {
                    var displayPos = new kakao.maps.LatLng(data[i].y, data[i].x);
                    new kakao.maps.Marker({ map: map, position: displayPos });
                    bounds.extend(displayPos);
                }
                map.setBounds(bounds);
            }
        });
    }
</script>
</body>
</html>
