<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 검색 서비스</title>
    <style>
        /* 화면 구성 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; height: 100vh; font-family: 'Malgun Gothic', sans-serif; }

        /* 왼쪽: 검색창 및 리스트 */
        #sidebar {
            width: 350px; height: 100%; padding: 20px;
            background-color: #fff; border-right: 1px solid #ddd;
            display: flex; flex-direction: column; z-index: 10;
        }
        .search-box { display: flex; gap: 5px; margin-bottom: 20px; }
        #keyword { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        #search-btn { padding: 10px; background: #fae100; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }

        #placesList { flex: 1; overflow-y: auto; list-style: none; }
        .place-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .place-item:hover { background-color: #f9f9f9; }
        .place-item h5 { margin-bottom: 5px; color: #333; font-size: 15px; }
        .place-item p { font-size: 12px; color: #777; }

        /* 오른쪽: 지도 */
        #map { flex: 1; height: 100%; background-color: #f0f0f0; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>📍 장소 검색</h2>
    <div class="search-box">
        <input type="text" id="keyword" placeholder="장소를 입력하세요" onkeypress="if(event.keyCode==13) searchPlaces()">
        <button id="search-btn" onclick="searchPlaces()">검색</button>
    </div>
    <ul id="placesList"></ul>
</div>

<div id="map"></div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7ff73be907fce66d6d1cd36a39a64110&libraries=services&autoload=false"></script>

                const lat = position.coords.latitude;

                console.error("위치 권한을 획득하지 못했습니다.");
            });
        }
    });
